<!DOCTYPE html>
<!-- DO NOT EDIT THIS FILE. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Employee Directory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Company Employee Directory</h1>
    <p>CA Lab Exam &middot; Section 3MCA03 &middot; Set A</p>
  </header>

  <main>
    <div class="controls">
      <section class="panel">
        <h2>Quick views</h2>
        <div class="actions">
          <button id="show-all" type="button">Show All Employees</button>
          <button id="top-three" type="button">Top 3 Earners</button>
        </div>
      </section>

      <section class="panel">
        <h2>Search by department</h2>
        <form id="search-form" class="inline">
          <select name="department" required>
            <option value="">Choose a department...</option>
            <option value="HR">HR</option>
            <option value="Sales">Sales</option>
            <option value="IT">IT</option>
          </select>
          <button type="submit">Search</button>
        </form>
      </section>

      <section class="panel">
        <h2>Filter</h2>
        <form id="filter-form" class="inline">
          <label>Salary at least
            <input type="number" name="minSalary" step="1" required>
          </label>
          <button type="submit">Filter</button>
        </form>
      </section>

      <section class="panel">
        <h2>Add Employee</h2>
        <form id="add-form" class="stack">
        <label>Name
          <input type="text" name="name" required>
        </label>
        <label>Department
          <select name="department" required>
            <option value="">Choose...</option>
            <option value="HR">HR</option>
            <option value="Sales">Sales</option>
            <option value="IT">IT</option>
          </select>
        </label>
        <label>City
          <input type="text" name="city" required>
        </label>
        <label>Salary
          <input type="number" name="salary" step="1" required>
        </label>
          <button type="submit">Add Employee</button>
        </form>
        <p id="add-status" class="status"></p>
      </section>
    </div>

    <section class="panel results">
      <h2 id="result-title">Results</h2>
      <div id="result"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
